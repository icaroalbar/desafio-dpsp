services:
  postgres:
    image: postgres:16
    container_name: edepe_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - edepe_pgdata:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: edepe_mailpit
    ports:
      - "1025:1025"   # SMTP (destino do smtplib/boto3 SES em dev)
      - "8025:8025"   # UI web pra ver o e-mail "enviado"

volumes:
  edepe_pgdata:
